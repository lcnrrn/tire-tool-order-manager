<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07090c" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <meta name="description" content="타이어 공구 신청 현황 (읽기 전용)" />
    <meta property="og:title" content="타이어 공구 신청 현황" />
    <meta property="og:description" content="신청 순서대로 공개하는 읽기 전용 목록" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>타이어 공구 신청 현황</title>
  </head>
  <body>
    <main class="doc" id="app">
      <header class="doc-head">
        <div class="ro-badge">읽기 전용</div>
        <h1 id="title">타이어 공구 신청 현황</h1>
        <p class="lede">신청하신 순서(접수 순번) 그대로 공개하는 목록입니다. 이 페이지에서는 아무것도 바꿀 수 없으며, 주소는 표시하지 않고 연락처는 뒷 4자리만 보여 드립니다.</p>
        <div class="totals">
          <div class="total"><span class="t-label">신청</span><span class="t-value" id="count">–</span></div>
          <div class="total"><span class="t-label">타이어 합계</span><span class="t-value" id="sum">–</span></div>
        </div>
        <p class="updated" id="updated"></p>
      </header>
      <div class="search">
        <input id="q" type="search" placeholder="이름 또는 연락처 뒷자리로 찾기" autocomplete="off" inputmode="search" />
      </div>
      <p class="status" id="status">불러오는 중…</p>
      <table class="list" id="table" hidden>
        <thead>
          <tr><th class="c-seq">순번</th><th>성함</th><th>연락처</th><th class="c-qty">타이어</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <footer class="foot">순번은 네이버 폼 응답 시각 기준입니다.</footer>
    </main>
    <script type="module" src="/src/open/main.ts"></script>
  </body>
</html>
